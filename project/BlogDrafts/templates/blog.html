{% extends "base.html" %}

{% block title %}
    {{blog.title}} | The Daily Draft
{% endblock title %}

{% block content %}
<div class="max-w-4xl mx-auto px-6 py-12">

  <!-- Heading -->
  <div class="text-center mb-10">
    <h1 class="text-4xl font-bold text-foreground">
      {{ blog.title }}
    </h1>
    <p class="text-muted-foreground-2 mt-2">
      {{ blog.category }}
    </p>
  </div>

  <!-- Blog Content -->
  <div class="bg-layer border border-layer-line rounded-xl shadow-sm p-8">
    <img src="{{ blog.image.url }}" alt="Blog Image" class="w-full h-auto rounded-lg mb-6 object-cover">
    <p class="text-foreground leading-relaxed">
      {{ blog.content }}
    </p>
  </div>
</div>

{% endblock content %}
