{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-3xl shadow-xl p-8 lg:p-10">

            <!-- Header -->
            <div class="text-center mb-10">
                <div class="mx-auto w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v-2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-semibold text-slate-900">Change Password</h1>
                <p class="text-slate-600 mt-2">
                    Please create a strong new password
                </p>
            </div>

            <form method="POST" class="space-y-8">
                {% csrf_token %}

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        New Password
                    </label>
                    <input 
                        type="password" 
                        name="new_password" 
                        required
                        minlength="6"
                        class="w-full px-5 py-4 bg-slate-50 border border-slate-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-900"
                        placeholder="Enter new password"
                    >
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Confirm New Password
                    </label>
                    <input 
                        type="password" 
                        name="confirm_password" 
                        required
                        minlength="6"
                        class="w-full px-5 py-4 bg-slate-50 border border-slate-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-900"
                        placeholder="Confirm new password"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 transition-all text-white font-semibold text-lg rounded-2xl shadow-lg shadow-blue-500/30">
                    Change Password
                </button>
            </form>

            <!-- Back Link -->
            <div class="text-center mt-8">
                <a href="{% url 'login' %}" 
                   class="text-slate-500 hover:text-slate-700 text-sm inline-flex items-center gap-1">
                    ← Back to Login
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
